# =========================================================
# Минимальный конфиг для мастер-класса по slow query log
# logging_collector=on -> лог пишется в файл (нужно для pgAdmin/docker exec).
# ВАЖНО: при этом `docker logs pg-slowlog` перестаёт показывать сами
# запросы (collector забирает stderr себе) — файл теперь единственный
# источник текстового лога, см. README про то, как его читать.
# =========================================================

listen_addresses = '*'

# --- Куда и как логировать ---
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = off

# --- Формат строки лога: время, pid, база, юзер, приложение, хост ---
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a,client=%h '

# --- Собственно slow query log ---
# Логируем каждый запрос, который выполняется дольше 200 мс
log_min_duration_statement = 200

# Показывать реальные значения параметров запроса (а не $1, $2...)
log_parameter_max_length = 512

# Логировать ожидания блокировок дольше deadlock_timeout — частая причина "тормозов"
log_lock_waits = on

# --- auto_explain: план выполнения прямо в логе, без ручного EXPLAIN ---
shared_preload_libraries = 'auto_explain,pg_stat_statements'

auto_explain.log_min_duration = 200
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on
auto_explain.log_format = 'text'

# --- pg_stat_statements: агрегированная статистика без парсинга текстовых логов ---
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# --- Немного окружения, чтобы было что дебажить на маленьких данных ---
work_mem = 4MB
shared_buffers = 128MB
